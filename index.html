<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f4e9">
<title>拼拼樂｜30 秒拼圖</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#22231e;background:#f8f4e9;font-family:system-ui,sans-serif}
main{max-width:570px;margin:auto;padding:26px clamp(16px,5vw,32px) 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid;padding-bottom:12px}
h1{font-size:clamp(38px,9vw,56px);margin:0;letter-spacing:-.06em}
header span{font-weight:750;color:#4c5143}
p{margin:14px 0;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fffdf6;border:1px solid #c7c6b3;border-radius:14px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
strong{font-size:24px;font-variant-numeric:tabular-nums}
progress{width:100%;height:7px;display:block;margin:12px 0 16px;accent-color:#6354c4}
.play{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:14px;align-items:start}
.board,.preview{display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:1;gap:4px;background:#24251e;padding:5px;border-radius:12px}
.preview{gap:1px;padding:3px;border-radius:6px}
aside p{font-size:14px;margin:0 0 5px;font-weight:700}
.tile{position:relative;border:0;padding:0;min-width:0;aspect-ratio:1;border-radius:3px;background-color:var(--base);background-image:var(--motif)}
button.tile{cursor:pointer;touch-action:manipulation}
.tile:disabled{cursor:default;opacity:1}
.tile[aria-pressed=true]{box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px #222}
button:focus-visible{outline:3px solid #5143b2;outline-offset:2px;z-index:1}
.actions{margin-top:14px}
#start,#finish{background:#25261e;color:#fffdf6;border:0;border-radius:12px;font:inherit;font-weight:800;padding:13px 24px;min-height:48px;cursor:pointer}
#music{min-height:48px;padding:8px 14px;border:1px solid #c7c6b3;border-radius:12px;background:#fffdf6;color:inherit;font:inherit;cursor:pointer}
#status{min-height:24px;margin:8px 0 0;color:#42463b}
@media(max-width:370px){.play{grid-template-columns:minmax(0,1fr) 68px;gap:9px}.stat{padding-inline:9px}}
</style>
</head>
<body>
<main>
<header><h1>拼拼樂</h1><span>30 秒拼圖</span></header>
<p>點兩塊交換位置。每塊放對得 10 分，九塊全對以 100 分結算。</p>
<section class="stats" aria-label="本局資訊">
<div class="stat"><span>剩餘</span><strong><span id="seconds">30</span> 秒</strong></div>
<div class="stat"><span>分數</span><strong id="score">0</strong></div>
</section>
<progress id="time" max="30" value="30" aria-label="剩餘時間"></progress>
<div class="play">
<div class="board" id="board" aria-label="拼圖區"></div>
<aside><p>完成圖</p><div class="preview" id="preview" aria-hidden="true"></div></aside>
</div>
<div class="actions"><button id="start" type="button">開始挑戰</button> <button id="finish" type="button" hidden>完成</button> <button id="music" type="button" aria-pressed="true">背景音樂</button><p id="status" role="status"></p></div>
</main>
<script>
const duration = 30;
const solved = Array.from({length:9}, (_, i) => i);
const designs = [
  ["#ff7966","circle at 100% 100%","#fdd86b"],
  ["#fdd86b","circle at 50% 0%","#6255cb"],
  ["#6255cb","circle at 0% 100%","#fa9a7d"],
  ["#cbe085","circle at 0% 50%","#246753"],
  ["#fa9a7d","circle at 50% 50%","#232820"],
  ["#fdd86b","circle at 100% 50%","#f68465"],
  ["#6255cb","circle at 100% 0%","#cbe085"],
  ["#246753","circle at 50% 100%","#fdd86b"],
  ["#f68465","circle at 0% 0%","#6255cb"]
];
const get = id => document.getElementById(id);
const start = get("start");
const finish = get("finish");
const status = get("status");
const music = get("music");
const AudioEngine = window.AudioContext || window.webkitAudioContext;
const melody = [72,76,79,76,74,77,81,77,76,79,84,79,74,77,79,71];
let audio;
let musicTimer;
let note = 0;
let musicEnabled = Boolean(AudioEngine);
music.hidden = !AudioEngine;

function playNote() {
  if (audio.state !== "running") return;
  const time = audio.currentTime;
  const oscillator = audio.createOscillator();
  const volume = audio.createGain();
  oscillator.type = "triangle";
  oscillator.frequency.value = 440 * 2 ** ((melody[note] - 69) / 12);
  volume.gain.setValueAtTime(0, time);
  volume.gain.linearRampToValueAtTime(0.045, time + 0.025);
  volume.gain.exponentialRampToValueAtTime(0.001, time + 0.20);
  oscillator.connect(volume);
  volume.connect(audio.destination);
  oscillator.start(time);
  oscillator.stop(time + 0.21);
  oscillator.onended = () => volume.disconnect();
  note = (note + 1) % melody.length;
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = undefined;
  if (audio) audio.suspend().catch(() => {});
}

function startMusic() {
  if (!musicEnabled || musicTimer !== undefined) return;
  try {
    audio ??= new AudioEngine();
    audio.resume().catch(() => {});
  } catch {
    return;
  }
  note = 0;
  musicTimer = setInterval(playNote, 230);
}

music.addEventListener("click", () => {
  musicEnabled = !musicEnabled;
  music.setAttribute("aria-pressed", String(musicEnabled));
  if (!musicEnabled) stopMusic();
  else if (playing) startMusic();
});
let order = [...solved];
let selected = -1;
let score = 0;
let timer;
let deadline = 0;
let playing = false;
const tiles = solved.map(position => {
  const tile = document.createElement("button");
  tile.type = "button";
  tile.className = "tile";
  tile.addEventListener("click", () => pick(position));
  get("board").append(tile);
  const sample = document.createElement("span");
  sample.className = "tile";
  paint(sample, position);
  get("preview").append(sample);
  return tile;
});

function paint(tile, id) {
  const [base, shape, accent] = designs[id];
  tile.style.setProperty("--base", base);
  tile.style.setProperty("--motif", "radial-gradient(" + shape + ", " + accent + " 44%, transparent 45%)");
}
function render() {
  tiles.forEach((tile, position) => {
    const id = order[position];
    paint(tile, id);
    tile.disabled = !playing;
    tile.setAttribute("aria-label", "位置 " + (position + 1) + "，拼片 " + (id + 1));
    tile.setAttribute("aria-pressed", String(position === selected));
  });
}
function shuffle() {
  order = [...solved];
  const pool = [...solved];
  while (pool.length > 0) {
    const [a, b, c] = Array.from({length: 3}, () =>
      pool.splice(Math.floor(Math.random() * pool.length), 1)[0]
    );
    [order[a], order[b], order[c]] = [order[b], order[c], order[a]];
  }
}
function updateClock() {
  const remaining = Math.max(0, (deadline - performance.now()) / 1000);
  get("seconds").textContent = Math.ceil(remaining);
  get("time").value = remaining;
  if (remaining === 0) endRound("時間到！");
}
function endRound(reason) {
  clearInterval(timer);
  stopMusic();
  finish.hidden = true;
  playing = false;
  selected = -1;
  render();
  start.disabled = false;
  start.hidden = false;
  start.textContent = "再玩一次";
  status.textContent = reason + "本局得分：" + score + " 分";
  start.focus();
}
function pick(position) {
  if (!playing) return;
  if (performance.now() >= deadline) {
    updateClock();
    return;
  }
  if (selected < 0 || selected === position) {
    selected = selected === position ? -1 : position;
  } else {
    [order[selected], order[position]] = [order[position], order[selected]];
    selected = -1;
    const correct = order.filter((id, index) => id === index).length;
    score = correct === solved.length ? 100 : correct * 10;
    get("score").textContent = score;
    if (score === 100) {
      endRound("全部拼對！");
      return;
    }
    status.textContent = "已拼對 " + correct + "／" + solved.length + " 塊。";
  }
  render();
}
finish.addEventListener("click", () => {
  if (!playing) return;
  if (performance.now() >= deadline) {
    updateClock();
    return;
  }
  endRound("挑戰完成！");
});
start.addEventListener("click", () => {
  if (playing) return;
  score = 0;
  get("score").textContent = score;
  status.textContent = "";
  shuffle();
  playing = true;
  startMusic();
  deadline = performance.now() + duration * 1000;
  start.disabled = true;
  start.hidden = true;
  finish.hidden = false;
  render();
  tiles[0].focus();
  updateClock();
  timer = setInterval(updateClock, 100);
});
render();
</script>
</body>
</html>
